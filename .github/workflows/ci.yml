name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC：定时健康审计（趋势防退化）
  workflow_dispatch:      # 手动触发（Actions 页 → Run workflow）

permissions:
  contents: read
  issues: write           # 定时失败开 issue 通知需要

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 覆盖率门禁（≥80%）
        run: npm run test:coverage
      - name: Lint
        run: npm run lint
      - name: 健康审计（含 npm audit）
        run: npm run health:ci
      # 定时运行失败 → 开 issue 触达（PR/推送失败由 PR 状态体现，不开 issue 避免噪音）
      - name: 定时失败通知（开 issue）
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⏰ 定时健康审计失败（${new Date().toISOString().slice(0, 10)}）`,
              body: `每周定时 CI 运行失败，请检查 Actions 日志：${runUrl}`,
            });
